# Build with Hugo and deploy to Hetzner webhosting via rsync
name: Deploy Hugo site to webhosting

on:
  push:
    tags: ["publish"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "webhosting-deploy"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.167.0
  BASE_URL: "https://unsurv.org/"

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ env.BASE_URL }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: ./public
          retention-days: 1

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: ./public
      - name: Deploy via SFTP (key auth)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          lftp -u "${{ secrets.DEPLOY_USER }}," \
            -e "set sftp:connect-program 'ssh -a -x -p 22 -i ~/.ssh/deploy_key -o BatchMode=yes'; mirror --reverse --delete --parallel=8 --verbose public/ /public_html; bye" \
            sftp://${{ secrets.DEPLOY_HOST }}